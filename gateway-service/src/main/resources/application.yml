server:
  port: 8080
spring:
  application:
    name: gateway-service
  config:
    import: classpath:gateway-routes.yml
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
